[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpu-shell"
version = "0.6.0"
description = "A Python command-line interface to manage and supervise AI accelerators"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "runpod",
    "requests",
]

[project.scripts]
xpu-shell = "xpu_shell.cli:main"
xpush = "xpu_shell.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

